# Database Configuration Example (PostgreSQL)
db.url=jdbc:postgresql://localhost:5432/course_registration
db.username=postgres
db.password=YOUR_PASSWORD_HERE
db.pool.maximum-size=20
db.pool.minimum-idle=5
db.pool.idle-timeout=30000
db.pool.connection-timeout=10000

# Server TCP Socket Configuration
server.port=9999
server.max-clients=100
server.heartbeat.timeout-ms=30000
